<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b3b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Familiekalender"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="ikon.svg" type="image/svg+xml"><link rel="stylesheet" href="mobil.css"><title>Familiekalender</title></head><body>
<section id="login" class="login hide"><form id="loginForm" class="login-card"><div class="eyebrow">FAMILIEN DØSSING PAULSEN</div><h1>Familiens kalender</h1><p>Log ind med dashboardets eksisterende bruger.</p><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Adgangskode</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">Log ind</button><p id="loginError" role="alert"></p></form></section>
<main id="app" class="hide"><header class="top"><div><div class="eyebrow">FAMILIENS OVERBLIK</div><h1>❤️ Familien Døssing Paulsen</h1></div><button id="logout" class="quiet">Log ud</button></header>
<div class="sticky"><nav class="views" aria-label="Visning"><button data-view="day">Dag</button><button data-view="week">Uge</button><button data-view="month">Måned</button></nav><div class="navigate"><button id="prev" aria-label="Forrige periode">‹</button><strong id="period"></strong><button id="next" aria-label="Næste periode">›</button><button id="today" class="today">I dag</button></div><div class="filters" id="filters"><button data-person="Danni" class="selected"><span class="dot danni"></span>Danni</button><button data-person="Cathrine" class="selected"><span class="dot cathrine"></span>Cathrine</button><button data-person="Familie" class="selected"><span class="dot familie"></span>Familie</button></div></div>
<div id="status" role="status" class="status"></div><section id="calendar" aria-live="polite"></section><footer>Opdateres automatisk · Vagtplaner er kun til overblik <span id="updated"></span></footer></main>
<script src="config.js"></script><script src="vagter.js"></script><script type="module" src="mobil.js"></script></body></html>
